<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Our Universe — Happy Anniversary</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #05020a;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      color: #fff; touch-action: none; user-select: none;
    }

    #intro {
      position: fixed; inset: 0; z-index: 100;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: radial-gradient(ellipse at center, #12081f 0%, #05020a 70%);
      transition: opacity 0.8s ease;
    }
    #intro.hidden { opacity: 0; pointer-events: none; }

    .stars-bg { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
    .star {
      position: absolute; width: 2px; height: 2px; background: #fff; border-radius: 50%;
      opacity: 0.6; animation: twinkle 3s infinite ease-in-out;
    }
    @keyframes twinkle { 0%, 100% { opacity: 0.3; } 50% { opacity: 0.9; } }

    .intro-content {
      position: relative; z-index: 2; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 12px;
    }
    .intro-title {
      font-size: clamp(1.8rem, 6vw, 3.2rem); font-weight: 300; letter-spacing: 0.15em;
      color: #fff; text-shadow: 0 0 20px rgba(255,255,255,0.4);
    }
    .intro-sub {
      font-size: clamp(0.85rem, 2.5vw, 1.05rem); color: rgba(255,255,255,0.55);
      letter-spacing: 0.08em; margin-bottom: 28px;
    }

    .heart-btn-wrap {
      position: relative; width: 90px; height: 90px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .heart-btn {
      position: relative; width: 70px; height: 64px;
      transform: scale(0.95); transition: transform 0.15s ease;
    }
    .heart-btn:active { transform: scale(0.9); }
    .heart-btn::before, .heart-btn::after {
      content: ''; position: absolute; top: 0; width: 36px; height: 56px;
      background: rgba(255, 120, 160, 0.12); border-radius: 36px 36px 0 0;
    }
    .heart-btn::before { left: 35px; transform: rotate(-45deg); transform-origin: 0 100%; }
    .heart-btn::after { left: 0; transform: rotate(45deg); transform-origin: 100% 100%; }

    .heart-progress {
      position: absolute; width: 100px; height: 100px; border-radius: 50%;
      border: 2px solid transparent; border-top-color: rgba(255, 120, 160, 0.3);
      opacity: 0; transition: opacity 0.3s; pointer-events: none;
    }
    .hold-hint { margin-top: 18px; font-size: 0.75rem; color: rgba(255,255,255,0.35); letter-spacing: 0.1em; }

    #warp {
      position: fixed; inset: 0; z-index: 90; background: #000;
      opacity: 0; pointer-events: none; overflow: hidden;
    }
    #warp.active { opacity: 1; pointer-events: all; }
    .warp-line {
      position: absolute; background: linear-gradient(to bottom, transparent, #fff, transparent);
      width: 2px; height: 120px; opacity: 0;
    }

    #universe-container {
      position: fixed; inset: 0; z-index: 10; opacity: 0; transition: opacity 1.2s ease;
    }
    #universe-container.visible { opacity: 1; }
    canvas { display: block; width: 100%; height: 100%; }

    #ui {
      position: fixed; inset: 0; z-index: 50; pointer-events: none;
      opacity: 0; transition: opacity 0.8s ease;
    }
    #ui.visible { opacity: 1; }
    .ui-btn {
      pointer-events: auto; position: absolute; width: 42px; height: 42px; border-radius: 50%;
      background: rgba(0,0,0,0.45); border: 1px solid rgba(255,255,255,0.25);
      color: #fff; font-size: 1.1rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(8px);
    }
    #btn-back { top: max(16px, env(safe-area-inset-top)); left: max(16px, env(safe-area-inset-left)); }
    #btn-music { top: max(16px, env(safe-area-inset-top)); right: max(16px, env(safe-area-inset-right)); }
    #hint {
      position: absolute; bottom: max(20px, env(safe-area-inset-bottom)); left: 50%;
      transform: translateX(-50%); font-size: 0.72rem; color: rgba(255,255,255,0.4);
      letter-spacing: 0.06em; white-space: nowrap; text-align: center;
    }

    #modal {
      position: fixed; inset: 0; z-index: 200; display: flex; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.7); backdrop-filter: blur(12px);
      opacity: 0; pointer-events: none; transition: opacity 0.35s ease;
    }
    #modal.open { opacity: 1; pointer-events: all; }
    .modal-card {
      background: rgba(15, 8, 25, 0.92); border: 1px solid rgba(255,255,255,0.15);
      border-radius: 16px; padding: 20px; max-width: 90vw; width: 360px; text-align: center;
      transform: scale(0.75); opacity: 0;
      transition: transform 0.4s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.35s ease;
    }
    #modal.open .modal-card { transform: scale(1); opacity: 1; }
    .modal-card img {
      width: 100%; border-radius: 10px; margin-bottom: 14px; display: block;
      max-height: 50vh; object-fit: cover;
    }
    .modal-title { font-size: 1.15rem; font-weight: 500; margin-bottom: 6px; color: #ff9ec0; }
    .modal-text { font-size: 0.9rem; color: rgba(255,255,255,0.7); line-height: 1.5; margin-bottom: 16px; }
    .modal-close {
      width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.2); color: #fff; font-size: 1rem; cursor: pointer;
      margin: 0 auto; display: flex; align-items: center; justify-content: center;
    }

    #puzzle-game, #fortune-game, #notes-game {
      position: fixed; inset: 0; z-index: 220;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.85); backdrop-filter: blur(16px);
      opacity: 0; pointer-events: none; transition: opacity 0.35s; padding: 16px;
    }
    #puzzle-game.open, #fortune-game.open, #notes-game.open { opacity: 1; pointer-events: all; }

    .puzzle-title, .fortune-title, .notes-title { font-size: 1.1rem; margin-bottom: 16px; color: #ffb0cc; }
    .puzzle-board {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px;
      width: min(300px, 85vw); aspect-ratio: 1; background: rgba(255,255,255,0.08);
      border-radius: 8px; overflow: hidden; border: 1px solid rgba(255,255,255,0.15);
    }
    .puzzle-piece {
      background-size: 300% 300%; cursor: pointer;
      transition: opacity 0.15s, outline 0.15s; outline: 2px solid transparent;
    }
    .puzzle-piece.selected { outline: 2px solid #ff80b0; opacity: 0.85; }
    .puzzle-success { margin-top: 16px; font-size: 1.1rem; color: #ff9ec0; opacity: 0; transition: opacity 0.4s; }
    .puzzle-success.show { opacity: 1; }

    .btn-close-game {
      margin-top: 18px; background: transparent; border: 1px solid rgba(255,255,255,0.3);
      color: #fff; padding: 10px 28px; border-radius: 20px; cursor: pointer; font-size: 0.9rem;
    }

    .cards-row { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; max-width: 420px; }
    .card {
      width: 68px; height: 100px; background: linear-gradient(145deg, #1a0e2e, #0d0618);
      border: 1px solid rgba(255,255,255,0.25); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem; color: rgba(255,255,255,0.5); cursor: pointer;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .card:hover:not(.revealed):not(.disabled) {
      transform: translateY(-6px); box-shadow: 0 8px 24px rgba(255, 140, 180, 0.25);
    }
    .card.disabled { opacity: 0.4; cursor: default; }
    .card.revealed {
      background: linear-gradient(145deg, #2a1538, #1a0a28); border-color: #ff80b0;
      color: #ff9ec0; font-size: 0.65rem; text-align: center; padding: 8px 4px;
      line-height: 1.3; white-space: pre-line;
    }
    .fortune-result {
      margin-top: 24px; font-size: 1.05rem; color: #ffb0cc; text-align: center;
      max-width: 300px; min-height: 40px; opacity: 0; transform: scale(0.9);
      transition: opacity 0.4s, transform 0.4s;
    }
    .fortune-result.show { opacity: 1; transform: scale(1); }

    .notes-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
      max-width: 320px; width: 100%;
    }
    .note-card {
      background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.18);
      border-radius: 12px; padding: 18px 12px; text-align: center; cursor: pointer;
      min-height: 80px; display: flex; align-items: center; justify-content: center;
      font-size: 0.85rem; color: rgba(255,255,255,0.5); transition: background 0.25s;
    }
    .note-card:hover { background: rgba(255, 140, 180, 0.12); }
    .note-card.revealed {
      color: #ffb0cc; border-color: rgba(255, 140, 180, 0.4); background: rgba(255, 100, 150, 0.1);
    }
  </style>
</head>
<body>

  <div id="intro">
    <div class="stars-bg" id="intro-stars"></div>
    <div class="intro-content">
      <h1 class="intro-title">Happy Anniversary</h1>
      <p class="intro-sub">Hold the heart to enter our universe</p>
      <div class="heart-btn-wrap" id="heart-hold">
        <div class="heart-progress" id="heart-progress"></div>
        <div class="heart-btn" id="heart-btn"></div>
      </div>
      <p class="hold-hint">กดค้างที่หัวใจ</p>
    </div>
  </div>

  <div id="warp"></div>
  <div id="universe-container"></div>

  <div id="ui">
    <button class="ui-btn" id="btn-back">↩</button>
    <button class="ui-btn" id="btn-music">♪</button>
    <div id="hint">ลากเพื่อหมุนจักรวาล • แตะหัวใจหรือแมว</div>
  </div>

  <div id="modal">
    <div class="modal-card">
      <img id="modal-img" src="" alt="Memory" />
      <div class="modal-title" id="modal-title"></div>
      <div class="modal-text" id="modal-text"></div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
  </div>

  <div id="puzzle-game">
    <div class="puzzle-title">ต่อจิ๊กซอภาพ</div>
    <div class="puzzle-board" id="puzzle-board"></div>
    <div class="puzzle-success" id="puzzle-success">ต่อสำเร็จแล้ว!</div>
    <button class="btn-close-game" id="btn-close-puzzle">ปิด</button>
  </div>

  <div id="fortune-game">
    <div class="fortune-title">เลือกไพ่คำทำนาย 1 ใบ</div>
    <div class="cards-row" id="cards-row"></div>
    <div class="fortune-result" id="fortune-result"></div>
    <button class="btn-close-game" id="btn-close-fortune">ปิด</button>
  </div>

  <div id="notes-game">
    <div class="notes-title">เปิดข้อความลับ</div>
    <div class="notes-grid" id="notes-grid"></div>
    <button class="btn-close-game" id="btn-close-notes">ปิด</button>
  </div>

  <audio id="bgm" loop preload="auto">
    <source src="music/music.mp3" type="audio/mpeg" />
  </audio>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    (function () {
      const c = document.getElementById('intro-stars');
      for (let i = 0; i < 80; i++) {
        const s = document.createElement('div');
        s.className = 'star';
        s.style.left = Math.random() * 100 + '%';
        s.style.top = Math.random() * 100 + '%';
        s.style.width = s.style.height = (Math.random() * 2 + 1) + 'px';
        s.style.animationDelay = Math.random() * 3 + 's';
        s.style.opacity = Math.random() * 0.6 + 0.2;
        c.appendChild(s);
      }
    })();

    const HOLD_DURATION = 2600;
    let holdStart = null, holdRaf = null, isHolding = false, entered = false;
    const heartHold = document.getElementById('heart-hold');
    const heartProgress = document.getElementById('heart-progress');

    function setHeartFill(t) {
      const alpha = 0.12 + t * 0.88;
      const glow = t * 28;
      const color = `rgba(255, ${Math.floor(100 + t * 55)}, ${Math.floor(140 + t * 40)}, ${alpha})`;
      let sheet = document.getElementById('heart-fill-style');
      if (!sheet) {
        sheet = document.createElement('style');
        sheet.id = 'heart-fill-style';
        document.head.appendChild(sheet);
      }
      sheet.textContent = `.heart-btn::before,.heart-btn::after{background:${color}!important;box-shadow:0 0 ${glow}px ${color}!important;}`;
      heartProgress.style.opacity = t > 0.05 ? 0.6 : 0;
      heartProgress.style.transform = `rotate(${t * 360}deg)`;
    }

    function onHoldStart(e) {
      if (entered) return;
      e.preventDefault();
      isHolding = true;
      holdStart = performance.now();
      tickHold();
    }
    function onHoldEnd() {
      if (!isHolding) return;
      isHolding = false;
      if (holdRaf) cancelAnimationFrame(holdRaf);
      if (performance.now() - holdStart < HOLD_DURATION) {
        setHeartFill(0);
        heartProgress.style.opacity = '0';
      }
    }
    function tickHold() {
      if (!isHolding) return;
      const t = Math.min(1, (performance.now() - holdStart) / HOLD_DURATION);
      setHeartFill(t);
      if (t >= 1) { isHolding = false; startTransition(); return; }
      holdRaf = requestAnimationFrame(tickHold);
    }
    heartHold.addEventListener('pointerdown', onHoldStart);
    window.addEventListener('pointerup', onHoldEnd);
    window.addEventListener('pointercancel', onHoldEnd);
    heartHold.addEventListener('contextmenu', e => e.preventDefault());

    function startTransition() {
      entered = true;
      setHeartFill(1);
      const intro = document.getElementById('intro');
      const warp = document.getElementById('warp');
      setTimeout(() => {
        intro.classList.add('hidden');
        warp.classList.add('active');
        createWarpLines(warp);
        setTimeout(() => {
          initUniverse();
          document.getElementById('universe-container').classList.add('visible');
          document.getElementById('ui').classList.add('visible');
          const bgm = document.getElementById('bgm');
          bgm.volume = 0.45;
          bgm.play().catch(() => {});
          setTimeout(() => { warp.classList.remove('active'); warp.innerHTML = ''; }, 900);
        }, 1400);
      }, 400);
    }

    function createWarpLines(container) {
      for (let i = 0; i < 60; i++) {
        const line = document.createElement('div');
        line.className = 'warp-line';
        line.style.left = Math.random() * 100 + '%';
        line.style.height = (80 + Math.random() * 180) + 'px';
        line.style.top = '-20%';
        line.style.animation = `warpFly ${0.5 + Math.random() * 0.5}s ${Math.random() * 0.6}s ease-in forwards`;
        container.appendChild(line);
      }
      if (!document.getElementById('warp-style')) {
        const s = document.createElement('style');
        s.id = 'warp-style';
        s.textContent = `@keyframes warpFly{0%{transform:translateY(0) scaleY(0.3);opacity:0}20%{opacity:0.9}100%{transform:translateY(140vh) scaleY(2.5);opacity:0}}`;
        document.head.appendChild(s);
      }
    }

    let scene, camera, renderer, universe;
    let isDragging = false;
    let prevPointer = { x: 0, y: 0 };
    let targetRot = { x: 0.15, y: 0 };
    let currentRot = { x: 0.15, y: 0 };
    let autoRotate = true;
    let particleHeart = null, galaxyPoints = null;
    let raycaster, mouse, interactiveObjects = [], clock;

    const PUZZLE_IMAGE = 'images/memory1.jpg';
    const memories = [
      { image: 'images/memory1.jpg', title: 'Moment 1', text: 'วันที่เราร่วมกันสร้างความทรงจำแรก...' },
      { image: 'images/memory2.jpg', title: 'Moment 2', text: 'ช่วงเวลาที่ทำให้เรายิ้มได้ทุกครั้งที่นึกถึง' },
      { image: 'images/memory3.jpg', title: 'Moment 3', text: 'ความทรงจำที่อยู่ด้วยกันตลอดไป' }
    ];

    function initUniverse() {
      const container = document.getElementById('universe-container');
      clock = new THREE.Clock();
      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x05020a, 0.012);

      camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(0, 2.8, 16);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0x05020a, 1);
      container.appendChild(renderer.domElement);

      scene.add(new THREE.AmbientLight(0x222233, 0.6));
      const pl = new THREE.PointLight(0xff88aa, 1.4, 50);
      pl.position.set(0, 4, 2);
      scene.add(pl);
      const sl = new THREE.PointLight(0xffffff, 0.3, 50);
      sl.position.set(5, -2, 5);
      scene.add(sl);

      universe = new THREE.Group();
      scene.add(universe);

      createStars();

      particleHeart = createParticleHeart();
      particleHeart.position.set(0, 3.8, 0);
      particleHeart.scale.setScalar(1.75);
      universe.add(particleHeart);

      galaxyPoints = createGalaxy();
      galaxyPoints.position.set(0, -1.0, 0);
      universe.add(galaxyPoints);

      const bh = createBlackHole();
      bh.position.set(0, -1.0, 0);
      universe.add(bh);

      // หัวใจ 3D ดูรูป — หงายถูกด้าน (ปลายชี้ลง)
      const heartPositions = [
        { x: -4.0, y: 1.8, z: 2.4 },
        { x: 4.2, y: 1.0, z: 1.8 },
        { x: -1.5, y: -0.2, z: 4.0 }
      ];
      heartPositions.forEach((pos, i) => {
        const h = createSmallHeart();
        h.position.set(pos.x, pos.y, pos.z);
        h.scale.setScalar(0.38);
        h.userData = { type: 'memory', index: i, ...memories[i] };
        interactiveObjects.push(h);
        universe.add(h);
      });

      const texts = [
        { t: 'I love you', pos: [2.8, 5.5, -1.5] },
        { t: 'Miss you', pos: [-3.5, 4.5, 1.2] },
        { t: 'Rak ter', pos: [0.6, 6.2, 2.2] },
        { t: 'คิดถึงนะ', pos: [-2.2, 2.4, -2.8] },
        { t: 'Forever', pos: [4.0, 3.0, -2.2] },
        { t: 'Thank you', pos: [-4.5, 0.8, 0.6] },
        { t: 'Our Universe', pos: [0, 7.0, 0] }
      ];
      texts.forEach(item => {
        const sp = createTextSprite(item.t);
        sp.position.set(...item.pos);
        universe.add(sp);
      });

      const catTexture = new THREE.TextureLoader().load('images/cat.png');
      const catConfigs = [
        { pos: [3.2, -1.6, 3.0], game: 'puzzle' },
        { pos: [-3.0, -1.8, 2.5], game: 'fortune' },
        { pos: [0.5, -2.2, 3.8], game: 'notes' }
      ];
      catConfigs.forEach(cfg => {
        const mat = new THREE.SpriteMaterial({ map: catTexture, transparent: true });
        const cat = new THREE.Sprite(mat);
        cat.scale.set(0.85, 0.85, 1);
        cat.position.set(...cfg.pos);
        cat.userData = { type: 'cat', game: cfg.game };
        interactiveObjects.push(cat);
        universe.add(cat);
      });

      raycaster = new THREE.Raycaster();
      mouse = new THREE.Vector2();
      setupPointerEvents();
      window.addEventListener('resize', onResize);
      animate();
    }

    function createStars() {
      const count = 2500;
      const pos = new Float32Array(count * 3);
      for (let i = 0; i < count; i++) {
        const r = 30 + Math.random() * 70;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos(2 * Math.random() - 1);
        pos[i*3] = r * Math.sin(phi) * Math.cos(theta);
        pos[i*3+1] = r * Math.sin(phi) * Math.sin(theta);
        pos[i*3+2] = r * Math.cos(phi);
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      universe.add(new THREE.Points(geo, new THREE.PointsMaterial({
        color: 0xffffff, size: 0.08, sizeAttenuation: true,
        transparent: true, opacity: 0.8, depthWrite: false
      })));
    }

    function createParticleHeart() {
      const n = 5200;
      const pos = new Float32Array(n * 3);
      const col = new Float32Array(n * 3);
      for (let i = 0; i < n; i++) {
        const t = Math.random() * Math.PI * 2;
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t);
        x *= 0.07; y *= 0.07;
        const z = (Math.random() - 0.5) * 0.75;
        const s = (Math.random() - 0.5) * 0.18;
        pos[i*3] = x + s; pos[i*3+1] = y + s; pos[i*3+2] = z;
        col[i*3] = 1; col[i*3+1] = 0.35 + Math.random()*0.25; col[i*3+2] = 0.55 + Math.random()*0.25;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.06, vertexColors: true, transparent: true, opacity: 0.92,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      }));
    }

    function createGalaxy() {
      const n = 4000;
      const pos = new Float32Array(n * 3);
      const col = new Float32Array(n * 3);
      const arms = 4;
      for (let i = 0; i < n; i++) {
        const arm = i % arms;
        const t = Math.random();
        const radius = Math.pow(t, 0.7) * 5.5;
        const angle = (arm / arms) * Math.PI * 2 + radius * 0.55 + (Math.random() - 0.5) * 0.45;
        pos[i*3] = Math.cos(angle) * radius;
        pos[i*3+1] = (Math.random() - 0.5) * (0.15 + radius * 0.04);
        pos[i*3+2] = Math.sin(angle) * radius;
        const b = 0.6 + Math.random() * 0.4;
        col[i*3] = col[i*3+1] = b; col[i*3+2] = b + 0.05;
      }
      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      return new THREE.Points(geo, new THREE.PointsMaterial({
        size: 0.04, vertexColors: true, transparent: true, opacity: 0.85,
        depthWrite: false, blending: THREE.AdditiveBlending, sizeAttenuation: true
      }));
    }

    function createBlackHole() {
      const g = new THREE.Group();
      g.add(new THREE.Mesh(
        new THREE.SphereGeometry(0.28, 32, 32),
        new THREE.MeshBasicMaterial({ color: 0x000000 })
      ));
      const ring = new THREE.Mesh(
        new THREE.TorusGeometry(0.48, 0.035, 16, 64),
        new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.7 })
      );
      ring.rotation.x = Math.PI / 2;
      g.add(ring);
      const ring2 = new THREE.Mesh(
        new THREE.TorusGeometry(0.62, 0.015, 12, 64),
        new THREE.MeshBasicMaterial({ color: 0xddddff, transparent: true, opacity: 0.35 })
      );
      ring2.rotation.x = Math.PI / 2;
      g.add(ring2);
      return g;
    }

    // หัวใจ 3D หงายถูกด้าน: ปลายชี้ลง
    function createSmallHeart() {
      const shape = new THREE.Shape();
      shape.moveTo(0, 0.4);
      shape.bezierCurveTo(0, 0.4, -0.1, 0.1, -0.35, 0.1);
      shape.bezierCurveTo(-0.6, 0.1, -0.6, 0.4, -0.6, 0.4);
      shape.bezierCurveTo(-0.6, 0.6, -0.4, 0.78, 0, 1.0);
      shape.bezierCurveTo(0.4, 0.78, 0.6, 0.6, 0.6, 0.4);
      shape.bezierCurveTo(0.6, 0.4, 0.6, 0.1, 0.35, 0.1);
      shape.bezierCurveTo(0.1, 0.1, 0, 0.4, 0, 0.4);

      const geo = new THREE.ExtrudeGeometry(shape, {
        depth: 0.32, bevelEnabled: true, bevelSegments: 3,
        steps: 1, bevelSize: 0.06, bevelThickness: 0.06
      });
      geo.center();
      // พลิกให้อยู่แนวถูก: ปลายหัวใจชี้ลง (Y ลบ)
      geo.rotateZ(Math.PI);

      return new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: 0xff6b9d,
        emissive: 0xff2a6d,
        emissiveIntensity: 0.45,
        metalness: 0.15,
        roughness: 0.4,
        side: THREE.DoubleSide
      }));
    }

    function createTextSprite(text) {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      canvas.width = 512; canvas.height = 128;
      ctx.clearRect(0, 0, 512, 128);
      ctx.font = '600 42px "Segoe UI", system-ui, sans-serif';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.shadowColor = 'rgba(255,255,255,0.8)';
      ctx.shadowBlur = 18;
      ctx.fillStyle = '#ffffff';
      ctx.fillText(text, 256, 64);
      const tex = new THREE.CanvasTexture(canvas);
      const sp = new THREE.Sprite(new THREE.SpriteMaterial({
        map: tex, transparent: true, opacity: 0.85, depthWrite: false
      }));
      sp.scale.set(2.8, 0.7, 1);
      return sp;
    }

    function setupPointerEvents() {
      const canvas = renderer.domElement;
      let downPos = null;

      canvas.addEventListener('pointerdown', (e) => {
        isDragging = true;
        autoRotate = false;
        prevPointer.x = e.clientX;
        prevPointer.y = e.clientY;
        downPos = { x: e.clientX, y: e.clientY };
        canvas.setPointerCapture(e.pointerId);
      });
      canvas.addEventListener('pointermove', (e) => {
        if (!isDragging) return;
        targetRot.y += (e.clientX - prevPointer.x) * 0.005;
        targetRot.x += (e.clientY - prevPointer.y) * 0.004;
        targetRot.x = Math.max(-0.8, Math.min(0.8, targetRot.x));
        prevPointer.x = e.clientX;
        prevPointer.y = e.clientY;
      });
      canvas.addEventListener('pointerup', (e) => {
        isDragging = false;
        canvas.releasePointerCapture(e.pointerId);
        if (downPos && Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y) < 8) {
          onCanvasClick(e);
        }
        downPos = null;
        setTimeout(() => { autoRotate = true; }, 2000);
      });
      canvas.addEventListener('pointercancel', () => { isDragging = false; downPos = null; });
    }

    function onCanvasClick(e) {
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects(interactiveObjects, true);
      if (!hits.length) return;
      let obj = hits[0].object;
      while (obj && !obj.userData.type && obj.parent) obj = obj.parent;
      if (!obj || !obj.userData.type) return;
      if (obj.userData.type === 'memory') openMemoryModal(obj.userData);
      else if (obj.userData.type === 'cat') {
        const g = obj.userData.game;
        if (g === 'puzzle') openPuzzle();
        else if (g === 'fortune') openFortune();
        else if (g === 'notes') openNotes();
      }
    }

    function onResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);
      const t = clock.getElapsedTime();
      if (autoRotate && !isDragging) targetRot.y += 0.0008;
      currentRot.x += (targetRot.x - currentRot.x) * 0.06;
      currentRot.y += (targetRot.y - currentRot.y) * 0.06;
      if (universe) {
        universe.rotation.x = currentRot.x;
        universe.rotation.y = currentRot.y;
      }
      if (particleHeart) {
        particleHeart.scale.setScalar(1.75 + Math.sin(t * 1.3) * 0.05);
        particleHeart.rotation.y = Math.sin(t * 0.25) * 0.06;
      }
      if (galaxyPoints) galaxyPoints.rotation.y += 0.0006;
      renderer.render(scene, camera);
    }

    function openMemoryModal(data) {
      document.getElementById('modal-img').src = data.image;
      document.getElementById('modal-title').textContent = data.title;
      document.getElementById('modal-text').textContent = data.text;
      document.getElementById('modal').classList.add('open');
    }
    document.getElementById('modal-close').addEventListener('click', () => {
      document.getElementById('modal').classList.remove('open');
    });
    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') document.getElementById('modal').classList.remove('open');
    });

    let selectedPiece = null;
    function openPuzzle() {
      const board = document.getElementById('puzzle-board');
      board.innerHTML = '';
      document.getElementById('puzzle-success').classList.remove('show');
      selectedPiece = null;
      let order = [0,1,2,3,4,5,6,7,8];
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
      if (order.every((v, i) => v === i)) [order[0], order[1]] = [order[1], order[0]];

      order.forEach((tileIndex) => {
        const piece = document.createElement('div');
        piece.className = 'puzzle-piece';
        piece.dataset.tile = tileIndex;
        const row = Math.floor(tileIndex / 3);
        const col = tileIndex % 3;
        piece.style.backgroundImage = `url(${PUZZLE_IMAGE})`;
        piece.style.backgroundSize = '300% 300%';
        piece.style.backgroundPosition = `${col * 50}% ${row * 50}%`;
        piece.addEventListener('click', () => {
          if (!selectedPiece) {
            selectedPiece = piece;
            piece.classList.add('selected');
          } else if (selectedPiece === piece) {
            piece.classList.remove('selected');
            selectedPiece = null;
          } else {
            const t1 = selectedPiece.dataset.tile;
            const t2 = piece.dataset.tile;
            selectedPiece.dataset.tile = t2;
            piece.dataset.tile = t1;
            [selectedPiece, piece].forEach(el => {
              const ti = parseInt(el.dataset.tile, 10);
              const r = Math.floor(ti / 3);
              const c = ti % 3;
              el.style.backgroundPosition = `${c * 50}% ${r * 50}%`;
            });
            selectedPiece.classList.remove('selected');
            selectedPiece = null;
            const tiles = Array.from(board.children).map(el => parseInt(el.dataset.tile, 10));
            if (tiles.every((v, i) => v === i)) {
              document.getElementById('puzzle-success').classList.add('show');
            }
          }
        });
        board.appendChild(piece);
      });
      document.getElementById('puzzle-game').classList.add('open');
    }
    document.getElementById('btn-close-puzzle').addEventListener('click', () => {
      document.getElementById('puzzle-game').classList.remove('open');
    });

    const fortunes = [
      'ทำอาหารให้กินฟรี\n1 ครั้ง',
      'นวดหลังฟรี\n1 ครั้ง',
      'เลือกหนังที่อยากดูได้\n1 เรื่อง',
      'ได้ขนมที่อยากกิน\n1 อย่าง',
      'เลือกสถานที่ไปเที่ยวได้\n1 ครั้ง'
    ];
    function openFortune() {
      const row = document.getElementById('cards-row');
      row.innerHTML = '';
      document.getElementById('fortune-result').classList.remove('show');
      document.getElementById('fortune-result').textContent = '';
      const shuffled = [...fortunes].sort(() => Math.random() - 0.5);
      for (let i = 0; i < 5; i++) {
        const card = document.createElement('div');
        card.className = 'card';
        card.textContent = '?';
        card.dataset.fortune = shuffled[i];
        card.addEventListener('click', () => {
          if (card.classList.contains('revealed') || card.classList.contains('disabled')) return;
          row.querySelectorAll('.card').forEach(c => { if (c !== card) c.classList.add('disabled'); });
          card.classList.add('revealed');
          card.textContent = card.dataset.fortune;
          const result = document.getElementById('fortune-result');
          result.textContent = card.dataset.fortune.replace('\n', ' ');
          result.classList.add('show');
        });
        row.appendChild(card);
      }
      document.getElementById('fortune-game').classList.add('open');
    }
    document.getElementById('btn-close-fortune').addEventListener('click', () => {
      document.getElementById('fortune-game').classList.remove('open');
    });

    const loveNotes = [
      'รักนะ ทุกวันเลย',
      'ขอบคุณที่อยู่ข้าง ๆ',
      'เธอคือจักรวาลของฉัน',
      'อยากกอดตอนนี้เลย',
      'Forever with you',
      'คิดถึงทุกครั้งที่หายไป'
    ];
    function openNotes() {
      const grid = document.getElementById('notes-grid');
      grid.innerHTML = '';
      const shuffled = [...loveNotes].sort(() => Math.random() - 0.5).slice(0, 4);
      shuffled.forEach(text => {
        const card = document.createElement('div');
        card.className = 'note-card';
        card.textContent = '?';
        card.addEventListener('click', () => {
          if (card.classList.contains('revealed')) return;
          card.classList.add('revealed');
          card.textContent = text;
        });
        grid.appendChild(card);
      });
      document.getElementById('notes-game').classList.add('open');
    }
    document.getElementById('btn-close-notes').addEventListener('click', () => {
      document.getElementById('notes-game').classList.remove('open');
    });

    document.getElementById('btn-back').addEventListener('click', () => location.reload());

    let musicOn = true;
    document.getElementById('btn-music').addEventListener('click', () => {
      const bgm = document.getElementById('bgm');
      if (musicOn) {
        bgm.pause();
        document.getElementById('btn-music').textContent = '♫';
        document.getElementById('btn-music').style.opacity = '0.5';
      } else {
        bgm.play().catch(() => {});
        document.getElementById('btn-music').textContent = '♪';
        document.getElementById('btn-music').style.opacity = '1';
      }
      musicOn = !musicOn;
    });

    document.body.addEventListener('touchmove', (e) => {
      if (e.target.closest('#puzzle-game') || e.target.closest('#fortune-game') ||
          e.target.closest('#notes-game') || e.target.closest('#modal')) return;
      e.preventDefault();
    }, { passive: false });
  </script>
</body>
